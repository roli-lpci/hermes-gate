name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build PyYAML==6.0.2
      - name: Verify release source identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release.py --tag "$RELEASE_TAG"
      - name: Verify Action install version is published or being released
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/check_action_default_published.py
      - name: Build distributions
        run: python -m build
      - name: Verify release artifact identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release.py --tag "$RELEASE_TAG" --dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Serialize the version check and upload across release tags.
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/hermes-gate/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install version parser
        run: python -m pip install --require-hashes -r .github/requirements-publish.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      # Runs after environment approval, against the actual downloaded artifact.
      - name: Verify downloaded artifact identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release.py --tag "$RELEASE_TAG" --dist dist
      - name: Reject superseded package
        run: python .github/scripts/check_pypi_version.py
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
